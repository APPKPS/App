<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ระบบบริหารจัดการการลาออนไลน์ - อบต.คลองประสงค์</title>
  <!-- ใส่ไอคอนโลโก้ อบต. บนแท็บเบราว์เซอร์ -->
  <link rel="icon" href="https://sv1.img.in.th/Hlqhvk.png" type="image/png">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden; /* ปิดสกรอลล์บาร์ซ้อนของหน้าต่างนอก */
      background-color: #f3f6fb;
    }

    .iframe-wrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* ดันขอบบนของ iframe ขึ้นไป -38px เพื่อซ่อนแถบของ Google Apps Script */
    .iframe-wrapper iframe {
      position: absolute;
      top: -10px; 
      left: 0;
      width: 100%;
      height: calc(100vh + 10px); /* ชดเชยความสูงด้านล่างให้เต็มจอพอดี */
      border: none;
    }

    /* สำหรับหน้าจอมือถือ แถบเตือนอาจจะสูงขึ้นเล็กน้อย ปรับเป็น -42px */
    @media (max-width: 768px) {
      .iframe-wrapper iframe {
        top: -12px;
        height: calc(100vh + 12px);
      }
    }
  </style>
</head>
<body>

  <div class="iframe-wrapper">
    <!-- ใส่属性 allow="clipboard-write" เพื่อให้ปุ่มคัดลอก LINE ทำงานผ่าน iframe ได้ด้วย -->
    <iframe 
      src="https://script.google.com/macros/s/AKfycbym9FmcTO7y1PT6ydi6jdrKYrO2tv7mipRDZM2F8isnFu_otVjJgJ-ehMAEkx6Kp7fkZw/exec" 
      allow="clipboard-read; clipboard-write">
    </iframe>
  </div>

</body>
</html>
